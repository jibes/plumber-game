name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main ] # main is checked by the deploy workflow

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'game/package-lock.json'
      - name: Install and check
        run: |
          cd game
          npm ci
          npm test
          npm run build:web
